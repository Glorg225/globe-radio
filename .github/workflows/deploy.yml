name: build-and-deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      # If Radio Browser is down, reuse the currently deployed snapshot so code changes still ship.
      - name: Snapshot stations (fallback to last deployed)
        run: |
          if ! npm run snapshot; then
            echo "::warning::Radio Browser unavailable, reusing the last deployed snapshot"
            npx tsx scripts/fetch-deployed-snapshot.ts "${{ steps.pages.outputs.base_url }}"
          fi
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_GA_ID: G-ENKZYY7NQ6
      # Analytics for the static SEO pages (marker <!-- analytics -->).
      - run: npx tsx scripts/inject-analytics.ts
        env:
          VITE_GA_ID: G-ENKZYY7NQ6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
