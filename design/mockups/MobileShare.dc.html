<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Радио планеты — открыта ссылка от друга</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Golos+Text:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC978}a:hover{color:#FFE2B0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0F1E; color: #EEF1F8; font-family: 'Golos Text', system-ui, sans-serif; position: relative; overflow: hidden">

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 16px; opacity: .5">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><ellipse cx="12" cy="12" rx="4" ry="9"></ellipse><path d="M3.5 9h17M3.5 15h17"></path></svg>
    <span style="font-family: Unbounded, sans-serif; font-weight: 700; font-size: 16px">Радио планеты</span>
  </header>

  <div style="position: absolute; left: 25px; top: 100px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle at 60% 35%, #1E2C55 0%, #111A3A 55%, #070B1A 100%); border: 1px solid #2A3768; opacity: .55">
    <div style="position: absolute; left: calc(64% - 8px); top: calc(36% - 8px); width: 16px; height: 16px; border-radius: 50%; background: {{accent}}; box-shadow: 0 0 0 8px rgba(255,181,71,.2), 0 0 24px {{accent}}"></div>
  </div>

  <section aria-label="Станция от друга" style="position: absolute; left: 16px; right: 16px; top: 330px; padding: 24px 20px 20px; border-radius: 24px; background: #121931; border: 1px solid #34407A; box-shadow: 0 30px 60px rgba(0,0,0,.6); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px">
    <div style="font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: #A3ADC8">Вам прислали станцию</div>
    <div style="width: 72px; height: 72px; border-radius: 18px; background: #222D5A; display: flex; align-items: center; justify-content: center; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 30px; color: {{accent}}">K</div>
    <div>
      <div style="font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 500">Kyoto Night Radio</div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 6px; font-size: 15px; color: #A3ADC8">
        <svg width="24" height="16" viewBox="0 0 54 36" style="border-radius: 2px"><rect width="54" height="36" fill="#FFFFFF"></rect><circle cx="27" cy="18" r="10" fill="#BC002D"></circle></svg>
        Киото, Япония · 22:32
      </div>
    </div>
    <button style="width: 100%; height: 56px; border-radius: 16px; border: 0; background: {{accent}}; color: #1A1206; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"></path></svg>
      Слушать
    </button>
    <div style="font-size: 13px; color: #A3ADC8; line-height: 1.4">Браузер включает звук только после нажатия — поэтому нужна эта кнопка.</div>
    <button style="height: 44px; padding: 0 16px; border: 0; background: transparent; color: #EEF1F8; font-size: 15px; text-decoration: underline">Открыть глобус</button>
  </section>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 20px; padding: 12px 14px; border-radius: 14px; background: #151C38; border: 1px solid #2A3460; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #C9D0E6">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>
    <span style="flex: 1">Добавить «Радио планеты» на главный экран</span>
    <button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #34407A; background: transparent; color: #EEF1F8; font-size: 13px">Установить</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5EE0D0","#FF7A90","#8FA8FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FFB547' };
  }
}
</script>
</body>
</html>
