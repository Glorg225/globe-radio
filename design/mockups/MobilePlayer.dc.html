<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Радио планеты — телефон, плеер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Golos+Text:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FFC978}a:hover{color:#FFE2B0}
@keyframes rp-pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.rp-ring{animation:rp-pulse 1.8s ease-out infinite}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0F1E; color: #EEF1F8; font-family: 'Golos Text', system-ui, sans-serif; position: relative; overflow: hidden">

  <sc-for list="{{stars}}" as="s" hint-placeholder-count="0">
    <div style="position: absolute; left: {{s.x}}%; top: {{s.y}}%; width: 1px; height: 1px; background: #C9D3F5; opacity: {{s.o}}"></div>
  </sc-for>

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><ellipse cx="12" cy="12" rx="4" ry="9"></ellipse><path d="M3.5 9h17M3.5 15h17"></path></svg>
    <span style="font-family: Unbounded, sans-serif; font-weight: 700; font-size: 16px; flex: 1">Радио планеты</span>
    <button aria-label="Удиви меня" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: {{accent}}; color: #1A1206; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg>
    </button>
  </header>

  <div role="group" aria-label="Вид карты" style="position: absolute; top: 68px; left: 50%; transform: translateX(-50%); display: flex; padding: 3px; border-radius: 10px; background: #151C38; border: 1px solid #2A3460">
    <button aria-pressed="true" style="height: 30px; padding: 0 14px; border-radius: 8px; border: 0; background: #2A3566; color: #EEF1F8; font-size: 13px; font-weight: 600">3D</button>
    <button aria-pressed="false" style="height: 30px; padding: 0 14px; border-radius: 8px; border: 0; background: transparent; color: #A3ADC8; font-size: 13px">Карта</button>
  </div>

  <div style="position: absolute; left: 25px; top: 120px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #1E2C55 0%, #111A3A 55%, #070B1A 100%); box-shadow: 0 0 60px rgba(90,130,255,.22), inset -20px -20px 50px rgba(0,0,0,.55); border: 1px solid #2A3768">
    <svg width="340" height="340" viewBox="0 0 340 340" fill="none" stroke="#3A4A85" stroke-width="1" style="position: absolute; inset: 0; opacity: .55">
      <ellipse cx="170" cy="170" rx="40" ry="169"></ellipse>
      <ellipse cx="170" cy="170" rx="100" ry="169"></ellipse>
      <ellipse cx="170" cy="170" rx="140" ry="169"></ellipse>
      <line x1="2" y1="135" x2="338" y2="135"></line>
      <line x1="2" y1="205" x2="338" y2="205"></line>
    </svg>
    <sc-for list="{{dots}}" as="d" hint-placeholder-count="0">
      <div style="position: absolute; left: calc({{d.x}}% - {{d.h}}px); top: calc({{d.y}}% - {{d.h}}px); width: {{d.s}}px; height: {{d.s}}px; border-radius: 50%; background: {{d.c}}; opacity: {{d.o}}; box-shadow: 0 0 6px {{d.c}}"></div>
    </sc-for>
    <div style="position: absolute; left: calc(38% - 6px); top: calc(40% - 6px); width: 12px; height: 12px">
      <div class="rp-ring" style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid {{accent}}"></div>
      <div style="position: absolute; inset: 2px; border-radius: 50%; background: {{accent}}"></div>
    </div>
  </div>

  <section aria-label="Карточка места" style="position: absolute; left: 0; right: 0; bottom: 150px; padding: 10px 16px 16px; border-radius: 22px 22px 0 0; background: #121931; border-top: 1px solid #2A3460">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #3A4677; margin: 0 auto 12px"></div>
    <div style="display: flex; align-items: center; gap: 12px">
      <svg width="42" height="28" viewBox="0 0 54 36" style="border-radius: 3px; flex-shrink: 0"><rect width="22" height="36" fill="#046A38"></rect><rect x="22" width="32" height="36" fill="#DA291C"></rect><circle cx="22" cy="18" r="7" fill="#FFE900"></circle></svg>
      <div style="flex: 1">
        <div style="font-family: Unbounded, sans-serif; font-size: 18px; font-weight: 500">Лиссабон</div>
        <div style="font-size: 13px; color: #A3ADC8">Португалия · португальский</div>
      </div>
      <div style="text-align: right">
        <div style="font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 500">14:32</div>
        <div style="font-size: 12px; color: #A3ADC8">местное время</div>
      </div>
    </div>
    <div style="font-size: 14px; line-height: 1.45; margin-top: 12px; color: #D5DBEC">Лиссабон — столица и крупнейший город Португалии, на берегу эстуария реки Тежу…</div>
    <a href="https://ru.wikipedia.org/wiki/Лиссабон" style="display: inline-block; margin-top: 6px; font-size: 14px">Подробнее в Википедии</a>
  </section>

  <div style="position: absolute; left: 8px; right: 8px; bottom: 74px; height: 68px; border-radius: 16px; background: #1A2346; border: 1px solid #34407A; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 10px; box-shadow: 0 10px 30px rgba(0,0,0,.45)">
    <div style="width: 46px; height: 46px; border-radius: 10px; background: #222D5A; display: flex; align-items: center; justify-content: center; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; color: {{accent}}">F</div>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 15px; font-weight: 600">Fado Lisboa 24</div>
      <div style="font-size: 12px; color: #A3ADC8">В эфире · сон через 30 мин</div>
    </div>
    <button aria-label="Ещё: таймер сна, поделиться" style="width: 44px; height: 44px; border: 0; background: transparent; color: #EEF1F8; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
    <button aria-label="Пауза" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: {{accent}}; color: #1A1206; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </button>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #0D1326; border-top: 1px solid #222B4F">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <button style="border: 0; background: transparent; color: {{t.color}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px">
        <span style="width: 22px; height: 3px; border-radius: 2px; background: {{t.bar}}"></span>
        {{t.name}}
      </button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#5EE0D0","#FF7A90","#8FA8FF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FFB547';
    let seed = 5;
    const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const clusters = [[52,30,10,22],[40,40,4,8],[45,23,4,6],[60,26,8,10],[74,20,10,8],[56,58,10,8],[70,45,7,6],[22,70,6,6],[48,74,8,4]];
    const dots = [];
    clusters.forEach(function (c) {
      for (let i = 0; i < c[3]; i++) {
        const x = c[0] + (rand() - 0.5) * c[2] * 2, y = c[1] + (rand() - 0.5) * c[2] * 1.6;
        if ((x - 50) * (x - 50) + (y - 50) * (y - 50) > 46 * 46) continue;
        const s = 3 + Math.round(rand() * 3);
        dots.push({ x: x.toFixed(2), y: y.toFixed(2), s: s, h: s / 2, o: (0.45 + rand() * 0.55).toFixed(2), c: accent });
      }
    });
    const stars = [];
    for (let i = 0; i < 40; i++) stars.push({ x: (rand() * 100).toFixed(1), y: (rand() * 55).toFixed(1), o: (0.3 + rand() * 0.5).toFixed(2) });
    const tabs = ['Глобус', 'Поиск', 'Избранное', 'Учу язык'].map(function (n, i) { return { name: n, color: i === 0 ? '#EEF1F8' : '#A3ADC8', bar: i === 0 ? accent : 'transparent' }; });
    return { accent: accent, dots: dots, stars: stars, tabs: tabs };
  }
}
</script>
</body>
</html>
